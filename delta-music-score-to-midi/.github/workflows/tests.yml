name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependency
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Run tests
        run: python -B -m unittest discover -s .agents/skills/delta-music-score-to-midi/tests -v

  windows-synthetic-demo:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core dependency
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Run synthetic end-to-end dry-run
        shell: pwsh
        run: ./scripts/Run-Synthetic-Demo.ps1
